[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-agent"
version = "0.2.0"
description = "Budget-controlled coding agent with auditable context policies and repair evaluation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
tokens = ["tiktoken>=0.8,<1", "tokenizers>=0.20,<1"]
inference = ["torch>=2.8,<3", "transformers>=5.4,<5.5"]
swebench = ["swebench==5.0.2"]
swesmith = ["pandas>=2", "pyarrow>=15"]
train = ["torch>=2.8,<3", "transformers>=5.4,<5.5", "peft>=0.19,<0.20", "accelerate>=1.12,<2"]

[project.scripts]
budget-agent = "budget_agent.cli:main"
budget-agent-learn = "budget_agent.learning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.mypy]
# The core library type-checks cleanly; CI keeps it that way (the lint job).
files = ["src/budget_agent"]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Optional extras that the lint job does not install.
module = ["openjudge.*", "peft.*", "tiktoken.*", "tokenizers.*", "torch.*", "transformers.*"]
ignore_missing_imports = true
