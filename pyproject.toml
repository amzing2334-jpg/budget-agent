[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-agent"
version = "0.4.1"
description = "Budget-controlled coding agent with auditable context policies and repair evaluation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
tokens = ["tiktoken>=0.8,<1", "tokenizers>=0.20,<1"]
# The ML ranges span the two tested stacks: the local Windows CUDA stack (requirements-train.verified.txt)
# and the GPU host every round ran on (requirements-gpu-host.lock.txt). The lock files hold the exact pins.
inference = ["torch>=2.8,<2.15", "transformers>=5.4,<5.21"]
swebench = ["swebench==5.0.2"]
swesmith = ["pandas>=2", "pyarrow>=15"]
train = ["torch>=2.8,<2.15", "transformers>=5.4,<5.21", "peft>=0.19,<0.22", "accelerate>=1.12,<1.16"]

[project.scripts]
budget-agent = "budget_agent.cli:main"
budget-agent-learn = "budget_agent.learning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.ruff.lint]
select = ["F", "E9", "B"]

[tool.ruff.lint.per-file-ignores]
# The excerpt builder's closure is called only within the loop iteration that defines it.
"src/budget_agent/context.py" = ["B023"]

[tool.mypy]
# The library and the pipeline scripts type-check cleanly; CI keeps it that way (the lint job).
files = ["src/budget_agent", "scripts"]
mypy_path = "src,scripts"   # scripts import the library and, in two cases, a sibling script
explicit_package_bases = true
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Optional extras that the lint job does not install.
module = ["openjudge.*", "peft.*", "tiktoken.*", "tokenizers.*", "torch.*", "transformers.*",
          "pandas.*", "pyarrow.*", "datasets.*", "huggingface_hub.*", "minisweagent.*", "swebench.*", "yaml.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["budget_agent"]
branch = true
omit = [
    "*/budget_agent/__main__.py",
    # Imported by pytest inside the graded test processes, never in the test process itself.
    "*/budget_agent/pytest_outcomes.py",
    # Exercised by the openjudge-contract job against the pinned upstream checkout.
    "*/budget_agent/openjudge_adapter.py",
]

[tool.coverage.report]
# The full-suite CI job (torch installed) measures 89%; the floor leaves one point for platform noise.
fail_under = 89
skip_empty = true
