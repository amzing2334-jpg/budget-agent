name: tests
on: [push, pull_request]
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,tokens]"
      - run: python -m pytest -q
      - run: python -m budget_agent demo --output runs/ci-smoke
      - name: Check out mini-SWE-agent v2.4.6
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/checkout@v4
        with:
          repository: SWE-agent/mini-swe-agent
          ref: a83fcae82d2a08f0ee0c688f9d137b3566c097f8
          path: .upstream/mini-swe-agent
          persist-credentials: false
      - name: Run the real mini-SWE-agent CPU contract tests
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        env:
          MINI_SWE_UPSTREAM_REPO: .upstream/mini-swe-agent
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          python -m venv "$RUNNER_TEMP/mini-swe-contract"
          source "$RUNNER_TEMP/mini-swe-contract/bin/activate"
          python -m pip install -r requirements-mini-swe-contract.txt
          python -m pytest -q tests/test_mini_swe_baseline.py -k real_upstream
  openjudge-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: agentscope-ai/OpenJudge
          ref: c2fdc38314cd971b03d4d9333cd2c9f24d85c27f
          path: .upstream/OpenJudge
      - run: python -m pip install -r requirements-openjudge-contract.lock.txt
      - run: python -m pytest -q tests/test_evaluation.py tests/test_openjudge_adapter.py tests/test_governance_integration.py tests/test_verifier_consistency.py tests/test_verifier_execution.py
        env:
          PYTHONPATH: .upstream/OpenJudge
