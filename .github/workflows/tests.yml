name: tests
on: [push, pull_request]
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,tokens]"
      - run: python -m pytest -q
      - run: python -m budget_agent demo --output runs/ci-smoke
  openjudge-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: agentscope-ai/OpenJudge
          ref: c2fdc38314cd971b03d4d9333cd2c9f24d85c27f
          path: .upstream/OpenJudge
      - run: python -m pip install -r requirements-openjudge-contract.lock.txt
      - run: python -m pytest -q tests/test_evaluation.py tests/test_openjudge_adapter.py tests/test_governance_integration.py tests/test_verifier_consistency.py
        env:
          PYTHONPATH: .upstream/OpenJudge
